<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3400" height="1500" viewBox="0 0 3400 1500" role="img" aria-labelledby="title desc">
  <title id="title">Swimlane proses bisnis SIMPEG Refactor</title>
  <desc id="desc">Alur login, pengelolaan data kepegawaian, import, payroll, approval, dan laporan pada SIMPEG Refactor.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#dc2626"/>
    </marker>
    <style>
      .font { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 25px; font-weight: 800; letter-spacing: .2px; }
      .subtitle { font-size: 15px; fill: #475569; }
      .lane-label { font-size: 17px; font-weight: 800; fill: #0f172a; }
      .lane-subtitle { font-size: 12px; fill: #475569; }
      .node-title { font-size: 15px; font-weight: 750; }
      .node-copy { font-size: 12px; fill: #475569; }
      .small { font-size: 12px; fill: #475569; }
      .edge-label { font-size: 12px; font-weight: 700; fill: #475569; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .edge-label-red { font-size: 12px; font-weight: 700; fill: #b91c1c; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .lane { stroke: #cbd5e1; stroke-width: 1.5; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .edge-blue { fill: none; stroke: #2563eb; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
      .edge-red { fill: none; stroke: #dc2626; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 7; marker-end: url(#arrowRed); }
      .node { stroke-width: 1.7; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="3400" height="1500" fill="#f8fafc"/>

  <!-- Header -->
  <rect x="30" y="24" width="3340" height="72" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="58" y="56" class="font title">SWIMLANE PROSES BISNIS SIMPEG REFACTOR</text>
  <text x="58" y="80" class="font subtitle">Login, pengelolaan data kepegawaian, import tervalidasi, payroll, approval, dan pelaporan</text>

  <!-- Swimlanes -->
  <rect x="30" y="116" width="3340" height="270" rx="10" fill="#fff7ed" class="lane"/>
  <rect x="30" y="386" width="3340" height="310" class="lane" fill="#eff6ff"/>
  <rect x="30" y="696" width="3340" height="230" class="lane" fill="#f5f3ff"/>
  <rect x="30" y="926" width="3340" height="230" class="lane" fill="#ecfdf5"/>
  <rect x="30" y="1156" width="3340" height="254" rx="10" class="lane" fill="#f8fafc"/>

  <!-- Lane headers -->
  <rect x="30" y="116" width="238" height="270" rx="10" fill="#ffedd5"/>
  <rect x="30" y="386" width="238" height="310" fill="#dbeafe"/>
  <rect x="30" y="696" width="238" height="230" fill="#ede9fe"/>
  <rect x="30" y="926" width="238" height="230" fill="#d1fae5"/>
  <rect x="30" y="1156" width="238" height="254" rx="10" fill="#e2e8f0"/>

  <text x="149" y="222" text-anchor="middle" class="font lane-label">ADMIN / OPERATOR</text>
  <text x="149" y="247" text-anchor="middle" class="font lane-subtitle">Kepegawaian &amp; payroll</text>
  <text x="149" y="493" text-anchor="middle" class="font lane-label">SISTEM SIMPEG</text>
  <text x="149" y="518" text-anchor="middle" class="font lane-subtitle">Validasi, transaksi &amp; audit</text>
  <text x="149" y="797" text-anchor="middle" class="font lane-label">KEPALA / APPROVER</text>
  <text x="149" y="822" text-anchor="middle" class="font lane-subtitle">Review pengajuan</text>
  <text x="149" y="1027" text-anchor="middle" class="font lane-label">PEGAWAI / USER</text>
  <text x="149" y="1052" text-anchor="middle" class="font lane-subtitle">Akses sesuai hak akses</text>
  <text x="149" y="1257" text-anchor="middle" class="font lane-label">OUTPUT &amp; AUDIT</text>
  <text x="149" y="1282" text-anchor="middle" class="font lane-subtitle">Dashboard, laporan &amp; riwayat</text>

  <!-- ADMIN NODES -->
  <g id="admin-login">
    <ellipse cx="390" cy="249" rx="102" ry="41" fill="#dcfce7" stroke="#16a34a" class="node"/>
    <text x="390" y="244" text-anchor="middle" class="font node-title">Mulai</text>
    <text x="390" y="263" text-anchor="middle" class="font node-copy">Login SIMPEG</text>
  </g>

  <g id="admin-modules">
    <rect x="548" y="199" width="250" height="100" rx="14" fill="#ffffff" stroke="#64748b" class="node"/>
    <text x="673" y="231" text-anchor="middle" class="font node-title">Pilih modul</text>
    <text x="673" y="253" text-anchor="middle" class="font node-copy">Pegawai · Jabatan · Payroll</text>
    <text x="673" y="273" text-anchor="middle" class="font node-copy">Kuota · Pengajuan · Laporan</text>
  </g>

  <g id="admin-master">
    <rect x="875" y="178" width="288" height="142" rx="14" fill="#ffffff" stroke="#64748b" class="node"/>
    <text x="1019" y="210" text-anchor="middle" class="font node-title">Kelola data kepegawaian</text>
    <text x="900" y="236" class="font node-copy">• CRUD pegawai, keluarga, pendidikan</text>
    <text x="900" y="256" class="font node-copy">• Jabatan &amp; pengangkatan</text>
    <text x="900" y="276" class="font node-copy">• Diklat, sertifikasi &amp; pelanggaran</text>
    <text x="900" y="296" class="font node-copy">• Import template XLSX</text>
  </g>

  <g id="admin-quota">
    <rect x="1236" y="178" width="270" height="142" rx="14" fill="#fff7ed" stroke="#f59e0b" class="node"/>
    <text x="1371" y="210" text-anchor="middle" class="font node-title">Atur kuota jabatan</text>
    <text x="1260" y="238" class="font node-copy">Pilih KCU / kantor cabang</text>
    <text x="1260" y="259" class="font node-copy">Master atau nama jabatan custom</text>
    <text x="1260" y="280" class="font node-copy">Edit, simpan, atau set kuota 0</text>
  </g>

  <g id="admin-payroll">
    <rect x="1578" y="178" width="278" height="142" rx="14" fill="#ffffff" stroke="#64748b" class="node"/>
    <text x="1717" y="210" text-anchor="middle" class="font node-title">Kelola payroll</text>
    <text x="1602" y="238" class="font node-copy">Upload XLSX payroll / master</text>
    <text x="1602" y="259" class="font node-copy">Ajukan pengajuan perubahan</text>
    <text x="1602" y="280" class="font node-copy">Lihat status approval</text>
  </g>

  <g id="admin-rework">
    <rect x="1940" y="188" width="240" height="122" rx="14" fill="#fee2e2" stroke="#dc2626" class="node"/>
    <text x="2060" y="220" text-anchor="middle" class="font node-title">Perbaiki / ajukan ulang</text>
    <text x="1963" y="248" class="font node-copy">Perbaiki file atau data</text>
    <text x="1963" y="269" class="font node-copy">Lengkapi alasan pengajuan</text>
    <text x="1963" y="290" class="font node-copy">Kirim kembali untuk diproses</text>
  </g>

  <!-- SYSTEM NODES -->
  <g id="system-access">
    <rect x="410" y="446" width="240" height="108" rx="14" fill="#ffffff" stroke="#2563eb" class="node"/>
    <text x="530" y="478" text-anchor="middle" class="font node-title">Validasi akses</text>
    <text x="434" y="506" class="font node-copy">Role, session &amp; route policy</text>
    <text x="434" y="527" class="font node-copy">Admin / kepala / user</text>
  </g>

  <g id="system-preview">
    <rect x="730" y="428" width="300" height="144" rx="14" fill="#eff6ff" stroke="#2563eb" class="node"/>
    <text x="880" y="460" text-anchor="middle" class="font node-title">Preview &amp; validasi server</text>
    <text x="754" y="488" class="font node-copy">Header, format, referensi master</text>
    <text x="754" y="509" class="font node-copy">ID pegawai, kantor, bank, rekening</text>
    <text x="754" y="530" class="font node-copy">Duplikasi dan aturan bisnis</text>
    <text x="754" y="551" class="font node-copy">File dikunci dengan token + hash</text>
  </g>

  <g id="system-valid">
    <polygon points="1160,500 1242,442 1324,500 1242,558" fill="#fef3c7" stroke="#d97706" stroke-width="1.7" filter="url(#shadow)"/>
    <text x="1242" y="496" text-anchor="middle" class="font node-title">Valid?</text>
    <text x="1242" y="516" text-anchor="middle" class="font node-copy">semua baris</text>
  </g>

  <g id="system-token">
    <rect x="1370" y="428" width="258" height="144" rx="14" fill="#dbeafe" stroke="#2563eb" class="node"/>
    <text x="1499" y="460" text-anchor="middle" class="font node-title">Preview disahkan</text>
    <text x="1394" y="488" class="font node-copy">Token milik session admin</text>
    <text x="1394" y="509" class="font node-copy">Berlaku terbatas waktu</text>
    <text x="1394" y="530" class="font node-copy">Commit membaca file asli</text>
    <text x="1394" y="551" class="font node-copy">Bukan JSON dari browser</text>
  </g>

  <g id="system-commit">
    <rect x="1670" y="428" width="288" height="144" rx="14" fill="#dcfce7" stroke="#16a34a" class="node"/>
    <text x="1814" y="460" text-anchor="middle" class="font node-title">Commit transaction</text>
    <text x="1694" y="488" class="font node-copy">Simpan / update data atomik</text>
    <text x="1694" y="509" class="font node-copy">Tutup jabatan aktif sebelumnya</text>
    <text x="1694" y="530" class="font node-copy">Catat operator &amp; audit trail</text>
    <text x="1694" y="551" class="font node-copy">Rollback bila gagal</text>
  </g>

  <g id="system-status">
    <rect x="2000" y="428" width="270" height="144" rx="14" fill="#ffffff" stroke="#64748b" class="node"/>
    <text x="2135" y="460" text-anchor="middle" class="font node-title">Sinkronisasi status</text>
    <text x="2024" y="488" class="font node-copy">Pegawai, jabatan &amp; kantor</text>
    <text x="2024" y="509" class="font node-copy">Kuota efektif per cabang</text>
    <text x="2024" y="530" class="font node-copy">Payroll current / scheduled</text>
    <text x="2024" y="551" class="font node-copy">Notifikasi perubahan</text>
  </g>

  <g id="system-dashboard">
    <rect x="2310" y="428" width="278" height="144" rx="14" fill="#ffffff" stroke="#64748b" class="node"/>
    <text x="2449" y="460" text-anchor="middle" class="font node-title">Hitung &amp; sajikan</text>
    <text x="2334" y="488" class="font node-copy">Dashboard kepegawaian</text>
    <text x="2334" y="509" class="font node-copy">Filter kantor / divisi / jabatan</text>
    <text x="2334" y="530" class="font node-copy">Rekap nominatif &amp; formasi</text>
    <text x="2334" y="551" class="font node-copy">Export laporan XLSX / PDF</text>
  </g>

  <!-- APPROVER NODES -->
  <g id="approval-needed">
    <polygon points="1700,811 1790,752 1880,811 1790,870" fill="#fef3c7" stroke="#d97706" stroke-width="1.7" filter="url(#shadow)"/>
    <text x="1790" y="806" text-anchor="middle" class="font node-title">Perlu approval?</text>
    <text x="1790" y="826" text-anchor="middle" class="font node-copy">sesuai kebijakan</text>
  </g>

  <g id="approval-review">
    <rect x="1940" y="756" width="265" height="110" rx="14" fill="#ffffff" stroke="#7c3aed" class="node"/>
    <text x="2072" y="789" text-anchor="middle" class="font node-title">Review pengajuan</text>
    <text x="1964" y="817" class="font node-copy">Bandingkan data lama &amp; baru</text>
    <text x="1964" y="838" class="font node-copy">Setujui atau tolak dengan alasan</text>
  </g>

  <g id="approval-decision">
    <polygon points="2260,811 2340,756 2420,811 2340,866" fill="#fef3c7" stroke="#d97706" stroke-width="1.7" filter="url(#shadow)"/>
    <text x="2340" y="806" text-anchor="middle" class="font node-title">Disetujui?</text>
    <text x="2340" y="826" text-anchor="middle" class="font node-copy">approve / reject</text>
  </g>

  <g id="approval-publish">
    <rect x="2470" y="756" width="280" height="110" rx="14" fill="#dcfce7" stroke="#16a34a" class="node"/>
    <text x="2610" y="789" text-anchor="middle" class="font node-title">Publish payroll</text>
    <text x="2494" y="817" class="font node-copy">Jadikan batch current / terjadwal</text>
    <text x="2494" y="838" class="font node-copy">Buat akses slip gaji aman</text>
  </g>

  <!-- USER NODES -->
  <g id="user-profile">
    <rect x="420" y="976" width="270" height="112" rx="14" fill="#ffffff" stroke="#16a34a" class="node"/>
    <text x="555" y="1009" text-anchor="middle" class="font node-title">Akses profil</text>
    <text x="444" y="1037" class="font node-copy">Profil, data diri &amp; keluarga</text>
    <text x="444" y="1058" class="font node-copy">Dokumen dan riwayat pengajuan</text>
  </g>

  <g id="user-payroll">
    <rect x="760" y="976" width="270" height="112" rx="14" fill="#ffffff" stroke="#16a34a" class="node"/>
    <text x="895" y="1009" text-anchor="middle" class="font node-title">Interaksi pegawai</text>
    <text x="784" y="1037" class="font node-copy">Ajukan / lengkapi data</text>
    <text x="784" y="1058" class="font node-copy">Lihat status approval</text>
  </g>

  <g id="user-slip">
    <rect x="2470" y="976" width="280" height="112" rx="14" fill="#ffffff" stroke="#16a34a" class="node"/>
    <text x="2610" y="1009" text-anchor="middle" class="font node-title">Akses slip gaji</text>
    <text x="2494" y="1037" class="font node-copy">Hanya payroll milik pegawai</text>
    <text x="2494" y="1058" class="font node-copy">Preview / download terlindungi</text>
  </g>

  <!-- OUTPUT NODES -->
  <g id="output-master">
    <rect x="430" y="1210" width="300" height="126" rx="14" fill="#ffffff" stroke="#0f766e" class="node"/>
    <text x="580" y="1244" text-anchor="middle" class="font node-title">Master data terpusat</text>
    <text x="454" y="1272" class="font node-copy">Pegawai, jabatan, kantor</text>
    <text x="454" y="1293" class="font node-copy">Pendidikan, diklat, sertifikasi</text>
    <text x="454" y="1314" class="font node-copy">Kuota jabatan per kantor</text>
  </g>

  <g id="output-audit">
    <rect x="900" y="1210" width="300" height="126" rx="14" fill="#ffffff" stroke="#0f766e" class="node"/>
    <text x="1050" y="1244" text-anchor="middle" class="font node-title">Riwayat &amp; audit trail</text>
    <text x="924" y="1272" class="font node-copy">Pengajuan dan approval</text>
    <text x="924" y="1293" class="font node-copy">Recycle bin dengan alasan</text>
    <text x="924" y="1314" class="font node-copy">Operator dan waktu perubahan</text>
  </g>

  <g id="output-payroll">
    <rect x="1370" y="1210" width="330" height="126" rx="14" fill="#ffffff" stroke="#0f766e" class="node"/>
    <text x="1535" y="1244" text-anchor="middle" class="font node-title">Payroll &amp; slip gaji</text>
    <text x="1394" y="1272" class="font node-copy">Batch current / riwayat batch</text>
    <text x="1394" y="1293" class="font node-copy">Approval dan publikasi terkontrol</text>
    <text x="1394" y="1314" class="font node-copy">Notifikasi perubahan payroll</text>
  </g>

  <g id="output-report">
    <rect x="1900" y="1210" width="350" height="126" rx="14" fill="#ffffff" stroke="#0f766e" class="node"/>
    <text x="2075" y="1244" text-anchor="middle" class="font node-title">Dashboard &amp; laporan</text>
    <text x="1924" y="1272" class="font node-copy">Ringkasan kepegawaian</text>
    <text x="1924" y="1293" class="font node-copy">Nominatif, formasi, kondisi, diklat</text>
    <text x="1924" y="1314" class="font node-copy">Filter kantor dan export</text>
  </g>

  <g id="output-security">
    <rect x="2470" y="1210" width="390" height="126" rx="14" fill="#ffffff" stroke="#0f766e" class="node"/>
    <text x="2665" y="1244" text-anchor="middle" class="font node-title">Kontrol keamanan</text>
    <text x="2494" y="1272" class="font node-copy">Role-based access &amp; ownership check</text>
    <text x="2494" y="1293" class="font node-copy">Validasi server dan transaksi atomik</text>
    <text x="2494" y="1314" class="font node-copy">Audit perubahan dan dokumen</text>
  </g>

  <!-- Main flow edges -->
  <path d="M492 249 H548" class="edge"/>
  <path d="M798 249 H875" class="edge"/>
  <path d="M673 299 V446 H530" class="edge-blue"/>
  <path d="M1163 249 H1236" class="edge"/>
  <path d="M1506 249 H1578" class="edge"/>
  <path d="M1717 320 V390 H1814 V428" class="edge-blue"/>

  <path d="M650 500 H730" class="edge-blue"/>
  <path d="M1030 500 H1160" class="edge-blue"/>
  <path d="M1324 500 H1370" class="edge-blue"/>
  <text x="1345" y="485" class="font edge-label">Ya</text>
  <path d="M1242 558 V340 H1898 V249 H1940" class="edge-red"/>
  <text x="1390" y="330" class="font edge-label-red">Tidak: perbaiki data</text>
  <path d="M1628 500 H1670" class="edge-blue"/>
  <path d="M1958 500 H2000" class="edge"/>
  <path d="M2270 500 H2310" class="edge"/>

  <!-- Approval branch -->
  <path d="M1814 572 V752" class="edge-blue"/>
  <path d="M1880 811 H1940" class="edge-blue"/>
  <text x="1898" y="797" class="font edge-label">Ya</text>
  <path d="M1790 870 V900 H2260 V811" class="edge"/>
  <text x="1845" y="895" class="font edge-label">Tidak: langsung aktif</text>
  <path d="M2205 811 H2260" class="edge-blue"/>
  <path d="M2420 811 H2470" class="edge-blue"/>
  <text x="2438" y="797" class="font edge-label">Ya</text>
  <path d="M2340 866 V900 H3000 V340 H2180 V249" class="edge-red"/>
  <text x="2400" y="895" class="font edge-label-red">Tidak: tolak + alasan</text>

  <!-- User and output edges -->
  <path d="M530 554 V976" class="edge-blue"/>
  <path d="M690 1032 H760" class="edge"/>
  <path d="M2610 866 V976" class="edge-blue"/>
  <path d="M2135 572 V700 H1250 V1168 H1050 V1210" class="edge"/>
  <path d="M1670 500 V650 H1450 V1168 H1535 V1210" class="edge"/>
  <path d="M2449 572 V680 H2850 V1168 H2075 V1210" class="edge"/>
  <path d="M880 572 V930 H350 V1168 H580 V1210" class="edge"/>
  <path d="M1050 1088 V1156" class="edge"/>
  <path d="M2610 1088 V1156 H2665 V1210" class="edge"/>

  <!-- Rework loops -->
  <path d="M2060 188 V150 H1019 V178" class="edge-red"/>
  <text x="1510" y="142" class="font edge-label-red">Revisi data / file</text>

  <!-- Legend -->
  <rect x="2900" y="1210" width="410" height="126" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="2924" y="1242" class="font node-title">Legenda</text>
  <line x1="2924" y1="1264" x2="3000" y2="1264" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="3018" y="1268" class="font small">alur normal</text>
  <line x1="2924" y1="1290" x2="3000" y2="1290" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="3018" y="1294" class="font small">validasi / kontrol sistem</text>
  <line x1="2924" y1="1316" x2="3000" y2="1316" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arrowRed)"/>
  <text x="3018" y="1320" class="font small">revisi / penolakan</text>

  <text x="30" y="1460" class="font small">SIMPEG Refactor · diagram alur bisnis berdasarkan modul aplikasi dan aturan akses yang berjalan</text>
</svg>
